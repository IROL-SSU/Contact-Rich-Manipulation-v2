<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title desc">
  <title id="title">Five-finger Approach, Rotation, and Push sequence in a shelf</title>
  <desc id="desc">Three-panel top-view diagram in an open-sided shelf with pillars and surrounding objects. A five-finger robot hand forms contact on a selected OBB face, rotates the blocker until its inward pushing normal aligns with the desired push direction, and pushes while maintaining alignment and avoiding the shelf pillars and surrounding objects.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 24px Arial, 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .subtitle { font: 600 16px Arial, 'Noto Sans KR', sans-serif; fill: #334155; }
      .body { font: 15px Arial, 'Noto Sans KR', sans-serif; fill: #334155; }
      .small { font: 13px Arial, 'Noto Sans KR', sans-serif; fill: #475569; }
      .formula { font: italic 17px Georgia, serif; fill: #0f172a; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .deck { fill: #fffbeb; stroke: #d6b56c; stroke-width: 2; stroke-dasharray: 8 6; }
      .post { fill: #475569; stroke: #1e293b; stroke-width: 2; }
      .neighbor { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; }
      .object { fill: #dbeafe; stroke: #1e3a8a; stroke-width: 2.5; }
      .selected { stroke: #f97316; stroke-width: 9; stroke-linecap: round; }
      .palm { fill: #d1fae5; stroke: #047857; stroke-width: 2.5; }
      .finger { fill: #a7f3d0; stroke: #047857; stroke-width: 2; }
      .contact { fill: #f97316; stroke: #fff7ed; stroke-width: 2; }
      .avoid { fill: #b91c1c; font: 700 12px Arial, 'Noto Sans KR', sans-serif; }
    </style>

    <!-- Schematic RH56E2-style five-finger hand, pointing in local +x. -->
    <g id="five-finger-hand">
      <rect x="-44" y="-16" width="49" height="32" rx="13" class="palm"/>
      <rect x="0" y="-39" width="66" height="78" rx="18" class="palm"/>
      <rect x="58" y="-47" width="57" height="11" rx="6" class="finger" transform="rotate(-9 58 -41.5)"/>
      <rect x="59" y="-27" width="56" height="11" rx="6" class="finger" transform="rotate(-4 59 -21.5)"/>
      <rect x="60" y="-5.5" width="55" height="11" rx="6" class="finger"/>
      <rect x="59" y="16" width="56" height="11" rx="6" class="finger" transform="rotate(4 59 21.5)"/>
      <rect x="58" y="36" width="57" height="11" rx="6" class="finger" transform="rotate(9 58 41.5)"/>
      <circle cx="-27" cy="0" r="5" fill="#047857"/>
    </g>

    <!-- Open-sided shelf top view: deck/usable boundary, four pillars, and other objects. -->
    <g id="shelf-scene">
      <rect x="18" y="78" width="394" height="340" rx="13" class="deck"/>
      <circle cx="30" cy="91" r="11" class="post"/>
      <circle cx="400" cy="91" r="11" class="post"/>
      <circle cx="30" cy="395" r="11" class="post"/>
      <circle cx="400" cy="395" r="11" class="post"/>

      <rect x="330" y="106" width="52" height="50" rx="11" class="neighbor"/>
      <path d="M342 106 L371 156" stroke="#94a3b8" stroke-width="2"/>
      <ellipse cx="360" cy="340" rx="24" ry="18" class="neighbor"/>
      <path d="M339 340 H381" stroke="#94a3b8" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1440" height="690" fill="#ffffff"/>
  <text x="720" y="37" text-anchor="middle" class="title">Approach / Contact Formation → Rotation / Pivoting → Push / Translation</text>
  <text x="720" y="64" text-anchor="middle" class="subtitle">Top view in an open-sided shelf: avoid pillars and neighboring objects throughout the sequence</text>

  <rect x="30" y="90" width="430" height="432" rx="18" class="panel"/>
  <rect x="505" y="90" width="430" height="432" rx="18" class="panel"/>
  <rect x="980" y="90" width="430" height="432" rx="18" class="panel"/>

  <use href="#shelf-scene" x="30" y="90"/>
  <use href="#shelf-scene" x="505" y="90"/>
  <use href="#shelf-scene" x="980" y="90"/>

  <line x1="462" y1="307" x2="494" y2="307" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <line x1="937" y1="307" x2="969" y2="307" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-gray)"/>

  <!-- Phase 1: approach and contact formation. -->
  <circle cx="72" cy="126" r="22" fill="#2563eb"/>
  <text x="72" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">1</text>
  <text x="105" y="123" class="title">Approach</text>
  <text x="105" y="148" class="subtitle">Contact Formation</text>

  <line x1="76" y1="191" x2="190" y2="191" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="78" y="181" class="body" fill="#2563eb">d_push</text>

  <g transform="rotate(-28 294 315)" filter="url(#shadow)">
    <rect x="219" y="265" width="150" height="100" rx="7" class="object"/>
    <line x1="219" y1="275" x2="219" y2="355" class="selected"/>
    <line x1="219" y1="315" x2="326" y2="315" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <circle cx="219" cy="289" r="6" class="contact"/>
    <circle cx="219" cy="315" r="6" class="contact"/>
    <circle cx="219" cy="341" r="6" class="contact"/>
  </g>
  <use href="#five-finger-hand" transform="translate(126 404) rotate(-28)"/>
  <path d="M81 445 C97 433, 111 420, 132 402" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="309" y="245" class="body" fill="#ea580c">current n_f</text>
  <text x="72" y="473" class="body">Form a downstream-ready wrist–hand contact</text>
  <text x="72" y="496" class="small">Five fingers may contact, migrate, release, and re-contact</text>

  <!-- Phase 2: rotation/pivoting and alignment. -->
  <circle cx="547" cy="126" r="22" fill="#2563eb"/>
  <text x="547" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">2</text>
  <text x="580" y="123" class="title">Rotation</text>
  <text x="580" y="148" class="subtitle">Pivoting / Alignment</text>

  <line x1="551" y1="191" x2="665" y2="191" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="553" y="181" class="body" fill="#2563eb">d_push</text>

  <g opacity="0.28" transform="rotate(-28 768 315)">
    <rect x="693" y="265" width="150" height="100" rx="7" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6"/>
  </g>
  <path d="M853 261 A112 112 0 0 1 859 359" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <text x="859" y="309" class="small">rotate / pivot</text>

  <g filter="url(#shadow)">
    <rect x="693" y="265" width="150" height="100" rx="7" class="object"/>
    <line x1="693" y1="275" x2="693" y2="355" class="selected"/>
    <line x1="693" y1="315" x2="823" y2="315" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
  </g>
  <use href="#five-finger-hand" transform="translate(578 315)"/>
  <circle cx="693" cy="276" r="5" class="contact"/>
  <circle cx="693" cy="296" r="5" class="contact"/>
  <circle cx="693" cy="315" r="5" class="contact"/>
  <circle cx="693" cy="334" r="5" class="contact"/>
  <circle cx="693" cy="354" r="5" class="contact"/>
  <text x="758" y="396" text-anchor="middle" class="formula">c_align = n_f^E · d_push^E → 1</text>
  <text x="720" y="433" text-anchor="middle" class="body">Align the selected face's inward normal</text>
  <text x="720" y="456" text-anchor="middle" class="body">while retaining a usable aggregate contact</text>
  <text x="720" y="493" text-anchor="middle" class="small">Translation during rotation is allowed inside the safe region</text>

  <!-- Phase 3: push while maintaining alignment and clearance. -->
  <circle cx="1022" cy="126" r="22" fill="#2563eb"/>
  <text x="1022" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">3</text>
  <text x="1055" y="123" class="title">Push</text>
  <text x="1055" y="148" class="subtitle">Translation</text>

  <line x1="1026" y1="191" x2="1140" y2="191" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="1028" y="181" class="body" fill="#2563eb">d_push</text>

  <rect x="1235" y="265" width="138" height="100" rx="7" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="1304" y="386" text-anchor="middle" class="small">target position</text>
  <g filter="url(#shadow)">
    <rect x="1113" y="265" width="150" height="100" rx="7" class="object"/>
    <line x1="1113" y1="275" x2="1113" y2="355" class="selected"/>
    <line x1="1113" y1="315" x2="1239" y2="315" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
  </g>
  <use href="#five-finger-hand" transform="translate(998 315)"/>
  <circle cx="1113" cy="276" r="5" class="contact"/>
  <circle cx="1113" cy="296" r="5" class="contact"/>
  <circle cx="1113" cy="315" r="5" class="contact"/>
  <circle cx="1113" cy="334" r="5" class="contact"/>
  <circle cx="1113" cy="354" r="5" class="contact"/>
  <line x1="1092" y1="410" x2="1288" y2="410" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="1192" y="439" text-anchor="middle" class="formula">n_f^E ∥ d_push^E</text>
  <text x="1195" y="469" text-anchor="middle" class="body">Maintain alignment, contact, and object stability</text>
  <text x="1195" y="493" text-anchor="middle" class="small">No contact with pillars or surrounding objects</text>

  <!-- Legend. -->
  <line x1="50" y1="557" x2="94" y2="557" class="selected"/>
  <text x="108" y="563" class="body">Selected OBB face</text>
  <rect x="305" y="544" width="36" height="26" rx="7" class="neighbor"/>
  <text x="352" y="563" class="body">Surrounding object: avoid</text>
  <circle cx="625" cy="557" r="11" class="post"/>
  <text x="646" y="563" class="body">Shelf pillar: avoid</text>
  <line x1="855" y1="557" x2="912" y2="557" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="927" y="563" class="body">n_f: inward normal = − outward face normal</text>

  <line x1="50" y1="607" x2="108" y2="607" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="123" y="613" class="body">d_push: commanded push direction</text>
  <use href="#five-finger-hand" transform="translate(487 607) scale(0.38)"/>
  <text x="546" y="613" class="body">RH56E2 five-finger hand (schematic)</text>
  <text x="890" y="613" class="body">Shelf support-plane contact is allowed</text>

  <text x="720" y="660" text-anchor="middle" class="small">Selected-face identity and world-frame command stay fixed within an episode; their EEF-frame vectors are updated at every policy step.</text>
</svg>
